app = "cargaclick"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.fly"

[deploy]
  release_command = "bash bin/fly-release"

[env]
  RAILS_ENV = "production"
  RACK_ENV = "production"
  PORT = "8080"
  PUMA_BIND = "tcp://0.0.0.0:8080"
  WEB_CONCURRENCY = "1"
  RAILS_MAX_THREADS = "5"
  RAILS_LOG_TO_STDOUT = "1"
  RAILS_SERVE_STATIC_FILES = "1"
  FORCE_SSL = "true"
  APP_HOST = "cargaclick.fly.dev"
  APP_URL = "https://cargaclick.fly.dev"
  CARGACLICK_REQUIRE_MASTER_KEY = "0"
  NATIONAL_FREIGHT_PRICING_ENABLED = "false"
  # Enable only after the target database and migration are approved.
  FLY_MIGRATIONS_ENABLED = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/up"
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[[mounts]]
  source = "cargaclick_storage"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
