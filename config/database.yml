default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  variables:
    statement_timeout: 15000

development:
  <<: *default
  database: cargaclick_development

test:
  <<: *default
  # Sobrescrevivel para quem nao e dono do banco cargaclick_test compartilhado
  # (ver "Rodando os testes" no README). Sem a variavel, o padrao nao muda.
  database: <%= ENV.fetch("CARGACLICK_TEST_DATABASE", "cargaclick_test") %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
